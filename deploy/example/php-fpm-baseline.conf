; PHP-FPM pool for the baseline (stock Drupal) site in a benchmark pair.
; The baseline and rebar pools are identical except that rebar's loads the
; extension. ondemand: suits a host short on memory, since workers exit when
; idle; benchmarks warm up first so all 4 are running while measuring.
[baseline]
user = www-data
group = www-data
listen = /run/php/php8.5-fpm-baseline.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 120s

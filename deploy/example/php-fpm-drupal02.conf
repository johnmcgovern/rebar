; Dedicated PHP-FPM pool for drupal02.example.com (rebar benchmark).
; drupal01 and drupal02 pools are identical except that drupal02 loads the
; rebar extension. ondemand: the host is short on memory, so workers exit
; when idle; benchmarks warm up first so all 4 are running while measuring.
[drupal02]
user = www-data
group = www-data
listen = /run/php/php8.5-fpm-drupal02.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 120s
; Loaded per pool (in the workers only), so no other site sees it.
php_admin_value[extension] = /var/www/drupal02.example.com/rebar/rebar.so

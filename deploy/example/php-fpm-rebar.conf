; PHP-FPM pool for a site running rebar (rebar.example.com here).
; The baseline and rebar pools are identical except that rebar's loads the
; extension. ondemand: suits a host short on memory, since workers exit when
; idle; benchmarks warm up first so all 4 are running while measuring.
[rebar]
user = www-data
group = www-data
listen = /run/php/php8.5-fpm-rebar.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 120s
; Loaded per pool (in the workers only), so no other site sees it.
php_admin_value[extension] = /var/www/rebar.example.com/rebar/rebar.so
